name: Build desktop packages
on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: 同时创建发布草稿（不公开发布）
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm format:check
      - name: Validate application
        run: pnpm check
      - run: pnpm rust:fmt -- --check
      - name: Validate native services
        run: pnpm rust:check
      - name: Check native code
        run: pnpm rust:lint
      - name: Build and verify internal test packages
        run: pnpm package:build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign --ci
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
  draft:
    if: ${{ inputs.create_draft }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-downloads
      - name: Validate packages and prepare release notes
        run: node scripts/release-draft.mjs release-downloads release-staging
      - id: version
        run: |
          node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "value=" + require("./package.json").version + "\n")'
      - name: Create a draft without publishing or replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          assets=()
          for asset in release-staging/*; do
            case "${asset##*/}" in
              WorkTodo_*.dmg|WorkTodo_*-setup.exe|WorkTodo_*.app.zip) assets+=("$asset") ;;
            esac
          done
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "发布草稿必须且仅包含 Mac DMG、Windows 安装器以及各自的应用压缩包"
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" "${assets[@]}" \
            --draft --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --notes-file release-staging/release-notes.md
