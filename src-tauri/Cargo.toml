[package]
name = "worktodo"
version = "0.0.6"
description = "Local-first project and task workspace"
authors = ["WorkTodo"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "worktodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"

tempfile = "3"

serde_json = "1"
libc = "0.2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
base64 = "0.21"
html5ever = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse", "UNNotificationSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSUserDefaults", "NSProcessInfo", "NSBundle"] }
core-graphics = "0.25"
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"
